<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ארנק התווים">
<title>ארנק התווים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Assistant:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: one narrow column, summary first; the code to scan is always one tap away. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --ink:#13231b; --muted:#5d6e64; --line:#dde5df;
  --accent:#0f6b43; --accent-ink:#ffffff; --accent-soft:#e2f0e8;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1511; --surface:#16211b; --ink:#e6efe9; --muted:#93a59a; --line:#26342c;
  --accent:#3fbf82; --accent-ink:#06130c; --accent-soft:#1a3326;
  --warn:#f0b357; --warn-soft:#3a2b12; --bad:#ff8a80; --bad-soft:#3b1a18;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0) + 32px)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.btn{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--accent-soft);color:var(--accent)}
.btn-plain{background:none;color:var(--accent);padding:6px 8px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;font-size:14px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
[hidden]{display:none!important}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.top h1{font-size:20px;font-weight:700}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sync button{padding:8px 12px;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* Summary */
.summary{padding:4px 2px 0}
.total{font-size:clamp(44px,13vw,60px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
.total small{font-size:.45em;font-weight:500;margin-inline-start:4px;color:var(--muted)}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Voucher card: styled like a till slip with a perforated edge */
.slip{background:var(--surface);border-radius:var(--r);padding:18px;position:relative;border:1px solid var(--line)}
.slip.next{border:2px solid var(--accent)}
.slip-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.bal{font-size:34px;font-weight:700}
.code{font-family:var(--display);font-size:22px;letter-spacing:.08em;direction:ltr;text-align:center;
  border-top:2px dashed var(--line);margin-top:14px;padding-top:14px;font-variant-numeric:tabular-nums;user-select:all}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1}
.others{display:flex;flex-direction:column;gap:10px}
.row-v{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.row-v .num{font-size:20px;font-weight:700}

/* Lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
.month{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tx .amt{font-weight:700;text-align:left}
.tx .d{color:var(--muted);font-size:13px;grid-column:1/-1}
.tx.cancel .amt{text-decoration:line-through;color:var(--muted)}
details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"‹";transform:rotate(-90deg);transition:transform .15s;color:var(--muted);font-size:20px}
details[open]>summary::after{transform:rotate(90deg)}
.used{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.used span:last-child{color:var(--muted);text-align:left}
.empty{color:var(--muted);padding:14px 0;text-align:center}

/* Messages */
.msg{border-radius:10px;padding:10px 14px;font-size:14px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.msg.info{background:var(--warn-soft);color:var(--warn)}

/* Sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:20px}
.otp{font-size:28px;letter-spacing:.4em;text-align:center;direction:ltr;font-family:var(--display)}

/* Scan view: always white, maximum contrast for the scanner */
.scan{position:fixed;inset:0;background:#fff;color:#111;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px}
.scan .qr svg{width:min(62vw,260px);height:auto;display:block}
.scan .bc{width:100%;max-width:440px}
.scan .bc svg{width:100%;height:90px;display:block}
.scan .c{font-family:var(--display);font-size:26px;letter-spacing:.08em;direction:ltr;font-variant-numeric:tabular-nums}
.scan .b{font-size:18px;color:#444}
.scan button{background:#111;color:#fff;margin-top:8px;padding:12px 28px}
.foot{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ארנק התווים</h1>
    <div class="sync"><span id="syncLabel"></span><button class="btn-ghost" id="syncBtn" type="button">רענון</button></div>
  </header>

  <div id="msg" class="msg" hidden></div>

  <!-- First run -->
  <section id="onboard" class="slip" hidden>
    <h3 style="font-size:19px;margin-bottom:6px">חיבור התווים שלך</h3>
    <p class="sub" style="margin:0 0 14px">מדביקים כאן את ה-SMS או המייל של הזמנת התווים. האפליקציה תמצא את הקישורים, ואחרי קוד אימות אחד יופיעו כל התווים שמקושרים לטלפון שלך.</p>
    <label for="smsIn">טקסט ההודעה</label>
    <textarea id="smsIn" placeholder="https://mycards.mltp.co.il/..."></textarea>
    <div class="actions"><button class="btn" id="onboardBtn" type="button">התחברות</button></div>
  </section>

  <!-- Main -->
  <section id="main" hidden>
    <div class="wrap" style="gap:18px">
      <div class="summary">
        <h2>יתרה זמינה</h2>
        <div class="total num" id="total"></div>
        <div class="sub" id="totalSub"></div>
        <div class="bar" aria-hidden="true"><i id="totalBar"></i></div>
      </div>

      <div id="nextWrap"></div>
      <div class="others" id="others"></div>

      <div>
        <h2 style="margin-bottom:8px">קניות</h2>
        <div class="panel" id="txList"></div>
      </div>

      <details class="panel" id="usedBox">
        <summary id="usedSum"></summary>
        <div id="usedList"></div>
      </details>

      <details class="panel">
        <summary>הגדרות</summary>
        <div style="display:flex;flex-direction:column;gap:14px;padding-bottom:16px">
          <div>
            <label for="phoneIn">מספר הטלפון לקבלת קוד אימות</label>
            <input id="phoneIn" type="tel" inputmode="numeric" autocomplete="tel" dir="ltr" placeholder="05XXXXXXXX">
          </div>
          <div>
            <label for="smsAdd">הוספת הודעת הזמנה חדשה</label>
            <textarea id="smsAdd" placeholder="מדביקים את ה-SMS או המייל של הזמנה חדשה"></textarea>
            <div class="actions"><button class="btn-ghost" id="addBtn" type="button">הוספה ורענון</button></div>
          </div>
          <div class="sub" id="linkInfo" style="font-size:13px"></div>
          <div>
            <label>ייצוא לאקסל</label>
            <div class="actions"><button class="btn-ghost" id="exportTx" type="button">היסטוריית מימושים</button><button class="btn-ghost" id="exportVouchers" type="button">רשימת תווים</button></div>
          </div>
          <div>
            <button class="btn-plain" id="wipeBtn" type="button" style="color:var(--bad);padding-inline:0">מחיקת כל הנתונים מהמכשיר</button>
            <div id="wipeConfirm" hidden class="actions">
              <button class="btn" id="wipeYes" type="button" style="background:var(--bad);color:#fff">כן, למחוק</button>
              <button class="btn-ghost" id="wipeNo" type="button">ביטול</button>
            </div>
          </div>
        </div>
      </details>
      <p class="foot">הנתונים נשמרים רק במכשיר הזה. המידע מגיע ישירות מ-Multipass. · גרסה 4</p>
    </div>
  </section>
</div>

<!-- Phone / OTP sheet -->
<div class="sheet-bg" id="otpSheet" hidden>
  <form class="sheet" id="otpForm" novalidate>
    <h3 id="otpTitle">קוד אימות</h3>
    <div id="phoneStep">
      <label for="phoneSheet">מספר הטלפון שאליו נשלחו התווים</label>
      <input id="phoneSheet" type="tel" inputmode="numeric" autocomplete="tel" dir="ltr" placeholder="05XXXXXXXX">
    </div>
    <div id="codeStep" hidden>
      <p class="sub" style="margin:0" id="otpSent"></p>
      <input id="otpIn" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-label="קוד אימות">
    </div>
    <div id="otpMsg" class="msg err" hidden></div>
    <div class="actions">
      <button class="btn" id="otpGo" type="submit">שליחת קוד</button>
      <button class="btn-ghost" id="otpCancel" type="button">ביטול</button>
    </div>
    <button class="btn-plain" id="otpResend" type="button" hidden>שליחת קוד חדש</button>
  </form>
</div>

<!-- Scan view -->
<div class="scan" id="scan" hidden>
  <div class="b" id="scanBal"></div>
  <div class="qr" id="scanQr"></div>
  <div class="bc"><svg id="scanBc"></svg></div>
  <div class="c" id="scanCode"></div>
  <button type="button" id="scanClose">סגירה</button>
</div>

<script>
"use strict";
const API = "https://restservices.mltp.co.il/api/MyVouchers/";
const COMPANY = 1290;
const KEY = "tavwallet.v1";
const LINK_RE = /https?:\/\/mycards\.mltp\.co\.il\/[^\s"'<>]+/g;

const $ = id => document.getElementById(id);
const ils = new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", minimumFractionDigits: 2 });
const ils0 = new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 });
const dFmt = new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "numeric", year: "2-digit" });
const dtFmt = new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
const mFmt = new Intl.DateTimeFormat("he-IL", { month: "long", year: "numeric" });

/* ---------- state ---------- */
let S = load();
function blank() { return { phone: "", links: [], latestLink: "", vouchers: [], activity: {}, activityAt: {}, lastSync: 0 }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.links)) return Object.assign(blank(), s); } catch (e) {}
  return blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- API ---------- */
async function api(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("השרת של Multipass החזיר שגיאה (" + r.status + ")");
  return r.json();
}
const getData = link => api("GetVouchersData", { token: link, companyId: COMPANY });

function extractLinks(text) {
  return [...new Set((text.match(LINK_RE) || []).map(u => u.replace(/[.,;:)\]]+$/, "")))];
}
function addLinks(list) {
  let added = 0;
  for (const l of list) if (!S.links.includes(l)) { S.links.push(l); added++; }
  return added;
}
const isDate = s => s && !String(s).startsWith("0001");

function applyData(d, link) {
  const map = (v, status) => ({
    id: String(v.voucherId), balance: +v.currentBudget || 0, original: +v.originalBudget || 0,
    created: v.creationDate, expires: v.expirationDate, name: v.policyName || "תו", status
  });
  S.vouchers = [
    ...(d.vouchers || []).map(v => map(v, "active")),
    ...(d.emptyVouchers || []).map(v => map(v, "empty")),
    ...(d.expiredVouchers || []).map(v => map(v, "expired")),
  ];
  S.latestLink = link;
  if (!S.links.includes(link)) S.links.push(link);
  S.lastSync = Date.now();
  save();
}

/* Fetch history for vouchers whose balance changed since we last looked (or never looked). */
async function refreshActivity(link) {
  const todo = S.vouchers.filter(v => S.activityAt[v.id] === undefined || S.activityAt[v.id] !== v.balance);
  let i = 0;
  async function worker() {
    while (i < todo.length) {
      const v = todo[i++];
      try {
        const r = await api("GetVoucherActivity", { token: link, cardId: v.id, companyId: COMPANY });
        if (r.resultInfo && r.resultInfo.success && r.vouchers && r.vouchers[0]) {
          S.activity[v.id] = (r.vouchers[0].activity || []).map(a => ({
            date: a.activityDate, amount: +a.amount || 0, type: a.activityType,
            branch: (a.branchName || "").trim(), ref: a.reference, cancelled: isDate(a.activityCancelationDate)
          }));
          S.activityAt[v.id] = v.balance;
        }
      } catch (e) { /* keep old history for this voucher */ }
      setSync(true, `טוען היסטוריה ${Math.min(i, todo.length)}/${todo.length}`);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  save();
}

/* ---------- sync flow ---------- */
let busy = false, otpLink = "", otpMode = "mycards", regToken = "";

/* auto = the check on app open: if a code is needed, keep showing saved data and wait for the user to tap refresh. */
async function sync(auto) {
  if (busy) return;
  if (!S.links.length) { render(); return; }
  busy = true; showMsg(); setSync(true, "בודק…");
  try {
    const candidates = [S.latestLink, ...S.links.slice().reverse()].filter((l, i, a) => l && a.indexOf(l) === i);
    let needOtp = null;
    for (const [n, link] of candidates.entries()) {
      if (n) setSync(true, `בודק קישור ${n + 1}/${candidates.length}`);
      const d = await getData(link);
      const id = d.resultInfo && d.resultInfo.resultId;
      if (id === 0) { await finish(d, link); return; }
      // Keep trying the other saved links: any one with a live session avoids the SMS code.
      if ((id === 604 || id === 602) && !needOtp) needOtp = { link, mode: id === 602 ? "register" : "mycards" };
      if (id === 429) throw new Error("יותר מדי ניסיונות. כדאי לנסות שוב בעוד כמה דקות.");
    }
    if (!needOtp) throw new Error("אף אחד מהקישורים לא תקין. אפשר להוסיף בהגדרות הודעת הזמנה עדכנית.");
    otpLink = needOtp.link; otpMode = needOtp.mode;
    if (auto === true && S.vouchers.length) { showMsg("info", "מוצגים הנתונים השמורים. כדי לעדכן, לוחצים על רענון ומקבלים קוד ב-SMS."); return; }
    openOtp();
  } catch (e) {
    showMsg("err", e.message || "אין חיבור לרשת");
  } finally {
    busy = false; setSync(false);
  }
}

async function finish(d, link) {
  applyData(d, link);
  render();
  setSync(true, "טוען היסטוריה…");
  await refreshActivity(link);
  render();
}

function openOtp() {
  $("otpSheet").hidden = false;
  $("otpMsg").hidden = true;
  const havePhone = !!S.phone;
  $("phoneSheet").value = S.phone;
  $("phoneStep").hidden = havePhone;
  $("codeStep").hidden = true;
  $("otpResend").hidden = true;
  $("otpTitle").textContent = "נדרש קוד אימות";
  $("otpGo").textContent = "שליחת קוד ב-SMS";
  if (havePhone) $("otpSent").textContent = "";
  $("otpGo").dataset.step = "send";
  (havePhone ? $("otpGo") : $("phoneSheet")).focus();
}
function closeOtp() { $("otpSheet").hidden = true; }
function otpError(t) { $("otpMsg").textContent = t; $("otpMsg").hidden = false; }
const cleanPhone = p => (p || "").replace(/\D/g, "").replace(/^972/, "0");
const maskPhone = p => p.length >= 10 ? p.slice(0, 3) + "-XXX-XX" + p.slice(-2) : p;

async function sendCode() {
  const phone = cleanPhone($("phoneSheet").value || S.phone);
  if (!/^05\d{8}$/.test(phone)) { $("phoneStep").hidden = false; otpError("צריך מספר נייד מלא, למשל 0541234567"); return; }
  S.phone = phone; save(); $("phoneIn").value = phone;
  $("otpGo").disabled = true; $("otpMsg").hidden = true;
  try {
    const r = await api(otpMode === "register" ? "Register" : "SendOtp", { link: otpLink, phone });
    if (r.isSuccess && r.token) {
      regToken = r.token;
      $("phoneStep").hidden = true; $("codeStep").hidden = false; $("otpResend").hidden = false;
      $("otpSent").textContent = "נשלח SMS עם קוד ל-" + maskPhone(phone);
      $("otpGo").textContent = "אימות"; $("otpGo").dataset.step = "verify";
      $("otpIn").value = ""; $("otpIn").focus();
    } else if (r.resultCode === 3) {
      closeOtp(); const d = await getData(otpLink);
      if (d.resultInfo.resultId === 0) await finish(d, otpLink); else throw new Error(d.resultInfo.resultMessage);
    } else if (r.resultCode === 2) {
      $("phoneStep").hidden = false; otpError("המספר הזה לא תואם למספר שמשויך לתווים.");
    } else {
      otpError(r.errorMessage || "שליחת הקוד נכשלה");
    }
  } catch (e) { otpError(e.message || "אין חיבור לרשת"); }
  finally { $("otpGo").disabled = false; }
}

async function verifyCode() {
  const code = ($("otpIn").value || "").replace(/\D/g, "");
  if (code.length < 4) { otpError("צריך להקליד את הקוד שהגיע ב-SMS"); return; }
  $("otpGo").disabled = true; $("otpMsg").hidden = true;
  try {
    let r, link = otpLink;
    if (otpMode === "register") {
      r = await api("ValidateOtpAndRegister", { link: otpLink, token: regToken, phone: S.phone, OtpCode: code });
    } else {
      r = await api("ValidateOtpMyCards", { OtpCode: code, Link: otpLink, phone: S.phone });
    }
    const id = r.resultInfo && r.resultInfo.resultId;
    if (id === 0) {
      if (r.myCardsUrl) link = r.myCardsUrl;
      closeOtp(); setSync(true, "טוען תווים…");
      const d = await getData(link);
      if (d.resultInfo.resultId !== 0) throw new Error(d.resultInfo.resultMessage || "טעינת התווים נכשלה");
      await finish(d, link);
      showMsg("ok", "התווים עודכנו");
    } else if (id === 610) otpError("הקוד לא תקין. כדאי לבדוק שוב את ה-SMS.");
    else if (id === 402) otpError("יותר מדי ניסיונות. אפשר לבקש קוד חדש.");
    else otpError((r.resultInfo && r.resultInfo.resultMessage) || "האימות נכשל");
  } catch (e) { closeOtp(); showMsg("err", e.message || "אין חיבור לרשת"); }
  finally { $("otpGo").disabled = false; setSync(false); }
}

/* ---------- rendering ---------- */
function setSync(on, text) {
  $("syncBtn").disabled = on;
  $("syncBtn").innerHTML = on ? '<span class="spin"></span>' : "רענון";
  $("syncLabel").textContent = on ? (text || "") : (S.lastSync ? "עודכן " + ago(S.lastSync) : "");
}
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "עכשיו"; if (m < 60) return `לפני ${m} דק׳`;
  const d = new Date(t), today = new Date();
  return d.toDateString() === today.toDateString() ? "היום " + d.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }) : dtFmt.format(d);
}
function showMsg(kind, text) { const m = $("msg"); if (!kind) { m.hidden = true; return; } m.className = "msg " + kind; m.textContent = text; m.hidden = false; }
const short = id => id.split("-")[0];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function daysLeft(iso) { return Math.ceil((new Date(iso) - Date.now()) / 864e5); }

function render() {
  const has = S.vouchers.length > 0;
  $("onboard").hidden = has;
  $("main").hidden = !has;
  $("smsIn").placeholder = S.links.length ? `שמורים ${S.links.length} קישורים. אפשר ללחוץ "התחברות" או להדביק הודעה נוספת` : "https://mycards.mltp.co.il/...";
  if (!busy) setSync(false);
  $("phoneIn").value = S.phone;
  $("linkInfo").textContent = S.links.length ? `שמורים ${S.links.length} קישורי הזמנה` : "";
  if (!has) return;

  const active = S.vouchers.filter(v => v.status === "active" && v.balance > 0).sort((a, b) => a.balance - b.balance || new Date(a.expires) - new Date(b.expires));
  const total = active.reduce((s, v) => s + v.balance, 0);
  const orig = S.vouchers.reduce((s, v) => s + v.original, 0);
  const t = ils.format(total).replace(/\s?₪/, "");
  $("total").innerHTML = `${esc(t)}<small>₪</small>`;
  $("totalSub").textContent = active.length
    ? `ב-${active.length === 1 ? "תו אחד" : active.length + " תווים"} מתוך ${S.vouchers.length} · נוצלו ${ils0.format(orig - total)} מתוך ${ils0.format(orig)}`
    : `כל ${S.vouchers.length} התווים נוצלו · ${ils0.format(orig)} בסך הכול`;
  $("totalBar").style.width = orig ? (100 * total / orig).toFixed(1) + "%" : "0";

  // next to use
  const next = active[0];
  if (next) {
    const dl = daysLeft(next.expires);
    $("nextWrap").innerHTML = `
      <article class="slip next">
        <div class="slip-head"><h2>לתשלום בקופה</h2>${dl < 60 ? `<span class="tag warn">פג בעוד ${dl} ימים</span>` : `<span class="tag">היתרה הקטנה ביותר</span>`}</div>
        <div class="bal num">${esc(ils.format(next.balance))}</div>
        <div class="meta"><span>תו ${esc(short(next.id))}</span><span>תוקף ${esc(dFmt.format(new Date(next.expires)))}</span></div>
        <div class="code">${esc(next.id)}</div>
        <div class="actions"><button class="btn" type="button" data-scan="${esc(next.id)}">הצגה לסריקה</button><button class="btn-ghost" type="button" data-copy="${esc(next.id)}">העתקת קוד</button></div>
      </article>`;
  } else {
    $("nextWrap").innerHTML = `<div class="slip"><div class="empty">אין כרגע תו עם יתרה. כשתקנה תווים חדשים, מדביקים את ההודעה בהגדרות.</div></div>`;
  }
  $("others").innerHTML = active.slice(1).map(v => `
    <div class="row-v"><div><div class="num">${esc(ils.format(v.balance))}</div><div class="meta" style="margin:0"><span>תו ${esc(short(v.id))}</span><span>תוקף ${esc(dFmt.format(new Date(v.expires)))}</span></div></div>
    <button class="btn-ghost" type="button" data-scan="${esc(v.id)}">הצגה</button></div>`).join("");

  // transactions (uses only)
  const tx = [];
  for (const [vid, list] of Object.entries(S.activity)) for (const a of list) if (a.type === 0) tx.push({ ...a, vid });
  tx.sort((a, b) => new Date(b.date) - new Date(a.date));
  const limit = $("txList").dataset.all ? tx.length : 12;
  let html = "", month = "";
  const monthTotals = {};
  for (const a of tx) if (!a.cancelled) { const k = a.date.slice(0, 7); monthTotals[k] = (monthTotals[k] || 0) + a.amount; }
  for (const a of tx.slice(0, limit)) {
    const k = a.date.slice(0, 7);
    if (k !== month) { month = k; html += `<div class="month"><span>${esc(mFmt.format(new Date(a.date)))}</span><span class="num">${esc(ils.format(monthTotals[k] || 0))}</span></div>`; }
    html += `<div class="tx${a.cancelled ? " cancel" : ""}"><b>${esc(a.branch || "מימוש")}</b><span class="amt num">${esc(ils.format(a.amount))}</span><span class="d">${esc(dtFmt.format(new Date(a.date)))} · תו ${esc(short(a.vid))}${a.cancelled ? " · בוטל" : ""}</span></div>`;
  }
  if (tx.length > limit) html += `<div style="text-align:center;padding:8px 0"><button class="btn-plain" type="button" id="moreTx">כל ${tx.length} הקניות</button></div>`;
  $("txList").innerHTML = html || `<div class="empty">ההיסטוריה תופיע אחרי הרענון</div>`;

  // used vouchers
  const used = S.vouchers.filter(v => !(v.status === "active" && v.balance > 0)).sort((a, b) => new Date(b.created) - new Date(a.created));
  $("usedBox").hidden = !used.length;
  $("usedSum").textContent = `תווים מנוצלים (${used.length})`;
  $("usedList").innerHTML = used.map(v => {
    const last = (S.activity[v.id] || []).filter(a => a.type === 0).sort((a, b) => new Date(b.date) - new Date(a.date))[0];
    return `<div class="used"><span>תו ${esc(short(v.id))} · ${esc(ils0.format(v.original))}${v.status === "expired" ? " · פג תוקף" : ""}</span><span>${last ? "נוצל עד " + esc(dFmt.format(new Date(last.date))) : "נקנה " + esc(dFmt.format(new Date(v.created)))}</span></div>`;
  }).join("");
}

/* ---------- scan view ---------- */
let wake = null;
function openScan(id) {
  const v = S.vouchers.find(x => x.id === id); if (!v) return;
  $("scanBal").textContent = "יתרה " + ils.format(v.balance);
  $("scanCode").textContent = v.id;
  try { const q = qrcode(0, "M"); q.addData(v.id); q.make(); $("scanQr").innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch (e) { $("scanQr").innerHTML = ""; }
  try { JsBarcode("#scanBc", v.id, { format: "CODE128", displayValue: false, height: 90, width: 2, margin: 8 }); } catch (e) {}
  $("scan").hidden = false;
  if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => wake = w).catch(() => {});
}
function closeScan() { $("scan").hidden = true; if (wake) { wake.release().catch(() => {}); wake = null; } }

/* ---------- export (CSV with BOM so Excel reads the Hebrew) ---------- */
const csvCell = x => { let s = x == null ? "" : String(x); if (/^[=+\-@]/.test(s) && isNaN(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
const csvDate = s => isDate(s) ? String(s).replace("T", " ").replace(/\.\d+/, "").slice(0, 19) : "";
async function exportCsv(name, head, rows) {
  if (!rows.length) { showMsg("err", "אין עדיין נתונים לייצוא. צריך לרענן קודם."); return; }
  const text = "﻿" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
  const file = new File([text], `${name}-${new Date().toISOString().slice(0, 10)}.csv`, { type: "text/csv" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: file.name }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function exportTx() {
  const rows = [];
  for (const [vid, list] of Object.entries(S.activity)) for (const a of list)
    rows.push([csvDate(a.date), a.type === 0 ? "מימוש" : a.type === 1 ? "טעינה" : a.type, a.amount, a.branch, vid, a.cancelled ? "כן" : "", a.ref]);
  rows.sort((a, b) => b[0].localeCompare(a[0]));
  exportCsv("tav-mimushim", ["תאריך", "סוג", "סכום", "סניף", "קוד תו", "בוטל", "אסמכתא"], rows);
}
function exportVouchers() {
  const status = { active: "פעיל", empty: "נוצל", expired: "פג תוקף" };
  const rows = S.vouchers.map(v => {
    const list = S.activity[v.id] || [];
    const used = list.filter(a => a.type === 0 && !a.cancelled).reduce((s, a) => s + a.amount, 0);
    return [v.id, status[v.status] || v.status, v.original, v.balance, Math.round(used * 100) / 100, list.filter(a => a.type === 0).length, csvDate(v.created), csvDate(v.expires)];
  });
  exportCsv("tav-tavim", ["קוד תו", "סטטוס", "סכום מקורי", "יתרה", "סה\"כ מימושים", "מספר מימושים", "נוצר", "תוקף עד"], rows);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-scan]"); if (s) return openScan(s.dataset.scan);
  const c = e.target.closest("[data-copy]");
  if (c) {
    const code = c.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(
      () => { c.textContent = "הועתק"; setTimeout(() => c.textContent = "העתקת קוד", 1500); },
      () => { const el = c.closest(".slip").querySelector(".code"); const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
  }
  if (e.target.id === "moreTx") { $("txList").dataset.all = "1"; render(); }
});
$("scanClose").onclick = closeScan;
$("syncBtn").onclick = () => sync();
$("onboardBtn").onclick = () => {
  const links = extractLinks($("smsIn").value);
  if (!links.length && !S.links.length) { showMsg("err", "לא נמצא בטקסט קישור של mycards.mltp.co.il"); return; }
  addLinks(links); save(); $("smsIn").value = ""; render(); sync();
};
$("addBtn").onclick = () => {
  const links = extractLinks($("smsAdd").value);
  if (!links.length) { showMsg("err", "לא נמצא בטקסט קישור של mycards.mltp.co.il"); return; }
  const n = addLinks(links); save(); $("smsAdd").value = "";
  showMsg("ok", n ? `נוספו ${n} קישורים` : "הקישורים כבר היו שמורים"); sync();
};
$("phoneIn").onchange = () => { S.phone = cleanPhone($("phoneIn").value); save(); };
$("otpForm").onsubmit = e => { e.preventDefault(); $("otpGo").dataset.step === "verify" ? verifyCode() : sendCode(); };
$("otpCancel").onclick = closeOtp;
$("otpResend").onclick = () => { $("otpGo").dataset.step = "send"; sendCode(); };
$("exportTx").onclick = exportTx;
$("exportVouchers").onclick = exportVouchers;
$("wipeBtn").onclick = () => { $("wipeConfirm").hidden = false; };
$("wipeNo").onclick = () => { $("wipeConfirm").hidden = true; };
$("wipeYes").onclick = () => { S = blank(); save(); $("wipeConfirm").hidden = true; render(); showMsg("ok", "הנתונים נמחקו מהמכשיר"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeScan(); closeOtp(); } });

render();
if (S.links.length && (!S.lastSync || Date.now() - S.lastSync > 30 * 60000)) sync(true);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  // iPhone keeps the home-screen app alive in the background: check for a new version whenever it comes back,
  // and reload once the new version takes over (unless the user is in the middle of something).
  const hadSw = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSw && !busy && $("otpSheet").hidden && $("scan").hidden) location.reload(); });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
